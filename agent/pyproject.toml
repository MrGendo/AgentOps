[project]
name = "agentops-agent"
version = "0.1.0"
description = "AgentOps 智能与质量模块：Agent Runtime、模型适配、评测与诊断"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
