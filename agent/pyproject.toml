[project]
name = "agentops-agent"
version = "0.1.0"
description = "AgentOps 智能与质量模块：Agent Runtime、模型适配、评测与诊断"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.setuptools.packages.find]
# 显式只收 app 包：evaldata 是数据目录不是包，flat-layout 自动发现会因
# "Multiple top-level packages" 拒绝安装（新鲜克隆必现）
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
