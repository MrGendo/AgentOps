# 生产形态：静态资源 + API 反代（开发期由 Vite 代理承担同一职责）
server {
    listen 80;
    # Docker 内建 DNS 动态解析：platform 容器重建后 IP 变化也能跟上
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $upstream_platform http://platform:8080;
        proxy_pass $upstream_platform;
        proxy_set_header Host $host;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
